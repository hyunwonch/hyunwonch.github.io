  {% if page.mermaid and page.mermaid.enabled %}
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  {% if page.mermaid.zoomable %}
  <script src="https://d3js.org/d3.v7.min.js"></script>
  {% endif %}
  <script>
    let theme = localStorage.getItem("theme");

    /* Create mermaid diagram as another node and hide the code block, appending the mermaid node after it
       this is done to enable retrieving the code again when changing theme between light/dark */
    document.querySelectorAll('pre>code.language-mermaid').forEach((elem) => {
      const svgCode = elem.textContent;
      const backup = elem.parentElement;
      backup.classList.add('unloaded');
      /* create mermaid node */
      let mermaid = document.createElement('pre');
      mermaid.classList.add('mermaid');
      const text = document.createTextNode(svgCode);
      mermaid.appendChild(text);
      backup.after(mermaid);
    });

    mermaid.initialize({ theme: theme, startOnLoad: false })

    /* Mermaid occasionally computes a viewBox before the final text metrics are
       available. Refit it to the rendered content so labels and arrowheads at
       the edges are not clipped, then let CSS scale wide diagrams responsively. */
    function fitMermaidSvg(svg) {
      const padding = 12;

      try {
        const bounds = svg.getBBox();
        if (!bounds.width || !bounds.height) return;

        const width = bounds.width + padding * 2;
        const height = bounds.height + padding * 2;
        svg.setAttribute('viewBox', `${bounds.x - padding} ${bounds.y - padding} ${width} ${height}`);
        svg.setAttribute('width', width);
        svg.setAttribute('height', height);
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      } catch (error) {
        console.warn('Could not fit Mermaid diagram to its contents.', error);
      }
    }

    async function renderMermaidDiagrams() {
      await mermaid.run({ querySelector: '.mermaid' });

      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      document.querySelectorAll('.mermaid svg').forEach(fitMermaidSvg);

      /* Zoomable mermaid diagrams */
      if (typeof d3 !== 'undefined') {
        var svgs = d3.selectAll('.mermaid svg');
        svgs.each(function () {
          var svg = d3.select(this);
          svg.html('<g>' + svg.html() + '</g>');
          var inner = svg.select('g');
          var zoom = d3.zoom().on('zoom', function (event) {
            inner.attr('transform', event.transform);
          });
          svg.call(zoom);
        });
      }
    }

    renderMermaidDiagrams();
  </script>
  {% endif %}
